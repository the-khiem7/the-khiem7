name: Update Credly Badges

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

# A manual run overlapping the cron run would race on git push.
concurrency:
  group: credly-badges
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run tests
        run: node --test "scripts/*.test.mjs"

      - name: Sync Credly badges into README
        env:
          CREDLY_PROFILE_URL: "https://www.credly.com/users/duy-khiem"
          CREDLY_USER_ID: "789141e9-d22e-40d4-bdf3-a9fd0f603f17"
          CREDLY_BADGE_LIMIT: ${{ vars.CREDLY_BADGE_LIMIT || '0' }}
          CREDLY_BADGES_PER_ROW: ${{ vars.CREDLY_BADGES_PER_ROW || '4' }}
          CREDLY_BADGE_FILTER: ${{ vars.CREDLY_BADGE_FILTER || '' }}
        run: node scripts/update-credly-badges.mjs

      - name: Commit README changes
        run: |
          git diff --quiet -- README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update Credly badges"
          git push
